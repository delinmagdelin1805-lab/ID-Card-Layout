<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ID Card Layout</title>

    <!-- CSS -->

    <link rel="stylesheet"
        href="style.css">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Font -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href=
"https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- ID Card Container -->

    <section class="card-container">

        <!-- ID Card -->

        <div class="id-card">

            <!-- Top Section -->

            <div class="top">

                <div class="logo">
                    D
                </div>

                <div class="company">

                    <h2>
                        Delin Studio
                    </h2>

                    <span>
                        Employee ID Card
                    </span>

                </div>

            </div>

            <!-- Profile -->

            <div class="profile">

                <img
                    src="https://i.pravatar.cc/300"
                    alt="Profile">

                <h1>
                    Delin
                </h1>

                <h3>
                    Frontend Developer
                </h3>

            </div>

            <!-- Details -->

            <div class="details">

                <div class="info">

                    <i class="fa-solid fa-id-badge"></i>

                    <span>
                        ID : DS1025
                    </span>

                </div>

                <div class="info">

                    <i class="fa-solid fa-envelope"></i>

                    <span>
                        delin@example.com
                    </span>

                </div>

                <div class="info">

                    <i class="fa-solid fa-phone"></i>

                    <span>
                        +91 98765 43210
                    </span>

                </div>

            </div>

            <!-- Footer -->

            <div class="footer">

                <div class="barcode"></div>

                <span>
                    www.delinstudio.com
                </span>

            </div>

        </div>

    </section>

    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
